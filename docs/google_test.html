<!DOCTYPE html>
<html>
<head><title>google-login-test</title></head>
<body>
<h1>google-login-test</h1>
<script>
(function() {
  var out = document.createElement('pre');
  out.style.fontSize = '16px';
  out.style.whiteSpace = 'pre-wrap';
  document.body.appendChild(out);
  function log(s) { out.textContent += s + "\n"; }

  window.handleNativeMessage = function(dataStr) {
    var s = String(dataStr);
    log("[handleNativeMessage] " + s);
    alert("RESULT: " + s.substring(0, 900));
  };

  var params = new URLSearchParams(window.location.search);
  var clientId = params.get("cid") || "REAL_1WIN_CLIENT_ID_PLACEHOLDER";
  log("Using clientId: " + clientId);

  try {
    window.AndroidBridge.sendToNative(JSON.stringify({
      type: "LOGIN_WITH_GOOGLE",
      data: { clientId: clientId }
    }));
    alert("Fired LOGIN_WITH_GOOGLE with clientId:\n" + clientId);
  } catch (e) {
    log("EXCEPTION: " + e);
    alert("EXCEPTION: " + e);
  }
})();
</script>
</body>
</html>
